<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CIRCUIT LAB v11</title>
<style>
:root{--bg:#1e1c1a;--out:#161412;--layer:#2d2b29;--layer2:#3a3632;--line:#0e0c0a;
  --txt:#f7e3c3;--dim:#b8a78d;--venom:#00e5ff;--amber:#ffb000;--warn:#e0664a;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
  --strip:calc(34px + env(safe-area-inset-bottom,0px));}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{margin:0;height:100%;background:var(--out);color:var(--txt);font-family:var(--mono);overflow:hidden;}
body{touch-action:none;}
#gc{display:block;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;touch-action:none;}
#hdl{position:fixed;top:0;left:0;right:0;bottom:0;z-index:45;pointer-events:none;}
.hh{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;background:rgba(30,28,26,.86);border:1px solid var(--venom);
  color:var(--venom);font-family:var(--mono);font-size:19px;line-height:1;padding:0;text-align:center;display:none;pointer-events:auto;cursor:pointer;}
.hh.del{border-color:var(--warn);color:var(--warn);}
.hh.txt{font-size:9px;letter-spacing:.5px;}
.hh.lit{background:rgba(0,229,255,.22);}
#scope{position:fixed;left:0;right:0;top:20px;z-index:42;background:rgba(22,20,18,.84);border-bottom:1px solid var(--line);display:none;}
#scopeHead{display:flex;gap:4px;align-items:center;padding:3px 5px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;}
#scopeHead::-webkit-scrollbar{display:none;}
.sch{font-family:var(--mono);font-size:9px;letter-spacing:.5px;border:1px solid var(--line);background:rgba(45,43,41,.86);color:var(--txt);padding:3px 6px;white-space:nowrap;flex-shrink:0;display:inline-flex;gap:4px;align-items:center;cursor:pointer;}
.schv{color:var(--txt);} .schx{color:var(--dim);padding:0 2px 0 4px;}
#scopeCv{display:block;position:static;width:100%;height:64px;touch-action:none;}
.hh:active{background:rgba(0,229,255,.18);}
#hLbl{position:absolute;font-size:8px;letter-spacing:1px;color:var(--txt);background:rgba(30,28,26,.72);padding:2px 5px;display:none;white-space:nowrap;transform:translateX(-50%);pointer-events:none;}
#hud{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:9px;
  background:rgba(30,28,26,.86);border-bottom:1px solid var(--line);padding:3px 9px;padding-top:calc(3px + env(safe-area-inset-top,0px));
  font-size:10px;letter-spacing:1.2px;white-space:nowrap;overflow:hidden;pointer-events:none;}
#hud .seg{flex-shrink:0;} #hud .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;}
#hud .hl{color:var(--venom);} #hud .am{color:var(--amber);} #hud .warn{color:var(--warn);}
#deck{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--layer);border-top:2px solid var(--line);
  box-shadow:0 -6px 24px rgba(0,0,0,.6);padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(calc(100% - var(--strip)));transition:transform .2s ease;max-height:30vh;}
#deck.open{transform:translateY(0);}
#deck-tab{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);}
.tab-lbl{font-size:10px;letter-spacing:3px;white-space:nowrap;flex-shrink:0;cursor:pointer;padding:8px 2px;}
.tab-lbl .car{display:inline-block;transition:transform .15s;color:var(--amber);}
#deck:not(.open) .tab-lbl .car{transform:rotate(180deg);}
.tab-btns{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;touch-action:pan-x;}
.tab-btns::-webkit-scrollbar{display:none;}
.tbtn{background:var(--layer2);border:1px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:5px 9px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.tbtn.on{border-color:var(--venom);color:var(--venom);}
#deck-body{padding:6px 10px 10px;max-height:calc(30vh - 34px);overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.pane{display:flex;flex-direction:column;gap:6px;} .pane.hidden{display:none;}
.comp-btns{display:flex;gap:5px;flex-wrap:wrap;}
.cbtn{background:var(--layer2);border:1px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:10px;padding:5px 8px;cursor:pointer;border-radius:2px;}
.cbtn.on{border-color:var(--venom);color:var(--venom);} .cbtn.warn{border-color:var(--warn);color:var(--warn);}
.cbtn:active{border-color:var(--amber);}
.grp{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:2px;color:var(--amber);margin-top:2px;padding:3px 0;cursor:pointer;border-bottom:1px solid var(--line);}
.grp .car{display:inline-block;width:10px;transition:transform .15s;} .grp.shut .car{transform:rotate(-90deg);}
.gbody{display:flex;flex-direction:column;gap:5px;} .gbody.shut{display:none;}
.srow{display:flex;align-items:center;gap:8px;font-size:10px;min-height:22px;}
.sdim{color:var(--txt);min-width:84px;white-space:nowrap;}
.sbadge{color:var(--venom);min-width:58px;text-align:right;white-space:nowrap;}
.ro{color:var(--venom);flex:1;text-align:right;}
.selhead{font-size:10px;color:var(--amber);letter-spacing:1.5px;}
.hint{font-size:10px;color:var(--dim);line-height:1.5;}
.desc{font-size:9.5px;color:var(--dim);line-height:1.45;letter-spacing:.02em;border-left:2px solid var(--layer2);padding-left:7px;}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:24px;background:transparent;margin:0;}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;background:var(--bg);border:2px solid var(--venom);border-radius:50%;}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="hdl"><button class="hh" id="hL"></button><button class="hh" id="hR"></button><button class="hh" id="hU"></button><button class="hh" id="hP"></button><div id="hLbl"></div></div>
<div id="hud">
  <span class="seg hl">CIRCUIT LAB v11</span>
  <span class="seg">t <span class="hl" id="hT">0</span></span>
  <span class="seg">PARTS <span class="hl" id="hParts">0</span></span>
  <span class="seg">WIRES <span class="hl" id="hWires">0</span></span>
  <span class="seg am" id="hSel"></span>
  <span class="seg grow hl" id="hStatus">OK</span>
</div>
<div id="scope"><div id="scopeHead"></div><canvas id="scopeCv"></canvas></div>
<div id="deck" class="open">
  <div id="deck-tab">
    <span class="tab-lbl" id="deckToggle"><span class="car">▾</span> CIRCUIT</span>
    <div class="tab-btns">
      <button class="tbtn on" data-tab="build">BUILD</button>
      <button class="tbtn" data-tab="bodies">BODIES</button>
      <button class="tbtn" data-tab="sim">SIM</button>
      <button class="tbtn" data-tab="saves">SAVES</button>
      <button class="tbtn" id="playBtn">❚❚ PAUSE</button>
      <button class="tbtn" id="undoBtn">↶ UNDO</button>
    </div>
  </div>
  <div id="deck-body">
    <div class="pane" id="pane-build">
      <div class="grp"><span class="car">▼</span>TOOLS</div>
      <div class="gbody">
        <div class="comp-btns">
          <button class="cbtn" data-tool="select">Select / Move</button>
          <button class="cbtn" data-tool="wire">Wire</button>
          <button class="cbtn" data-tool="delete">Delete</button>
          <button class="cbtn" data-tool="probe">Probe</button>
          <button class="cbtn" id="fitBtn">Fit view</button>
        </div>
        <div class="comp-btns">
          <button class="cbtn" data-tool="battery">+ Battery</button>
          <button class="cbtn" data-tool="resistor">+ Resistor</button>
          <button class="cbtn" data-tool="led">+ LED</button>
          <button class="cbtn" data-tool="diode">+ Diode</button>
          <button class="cbtn" data-tool="capacitor">+ Capacitor</button>
          <button class="cbtn" data-tool="switch">+ Switch</button>
          <button class="cbtn" data-tool="ground">+ Ground</button>
          <button class="cbtn" data-tool="motor">+ Motor</button>
          <button class="cbtn" data-tool="magnet">+ Magnet</button>
          <button class="cbtn" data-tool="body">+ Body</button>
          <button class="cbtn" data-tool="rope">+ Chain</button>
          <button class="cbtn" data-tool="gate">+ Gate</button>
          <button class="cbtn" data-tool="not">+ NOT</button>
          <button class="cbtn" data-tool="relay">+ Relay</button>
          <button class="cbtn" data-tool="button">+ Button</button>
        </div>
      </div>
      <div class="grp"><span class="car">▼</span>SELECTED</div>
      <div class="gbody" id="selBody"></div>
    </div>
    <div class="pane hidden" id="pane-bodies">
      <div class="grp"><span class="car">▼</span>BODIES · MATTER</div>
      <div class="gbody" id="bodiesBody"></div>
    </div>
    <div class="pane hidden" id="pane-sim">
      <div class="grp"><span class="car">▼</span>SIMULATION</div>
      <div class="gbody" id="simBody"></div>
    </div>
    <div class="pane hidden" id="pane-saves">
      <div class="grp"><span class="car">▼</span>SAVE SLOTS</div>
      <div class="gbody" id="savesBody"></div>
    </div>
  </div>
</div>
<script>
(function(root){
'use strict';
// CIRCUIT_LAB engine: Modified Nodal Analysis (Norton sources, no extra rows),
// dense Gaussian elimination w/ partial pivoting, Newton-Raphson for diodes
// with SPICE pnjlim limiting, backward-Euler capacitors, gmin to ground on every node.
const VT=0.025852;
const DEF={
  battery:{V:9,r:0.2},
  resistor:{R:330},
  led:{color:'red',Vf:1.8,Rs:5,Imax:0.04},
  diode:{Vf:0.7,Rs:0.5},
  capacitor:{C:470e-6},
  switch:{closed:true},
  ground:{},
  // DC motor: winding R+L, back-EMF k·ω, rotor inertia J, viscous drag bv, coulomb friction Tf, external load brake (N·m)
  // J is a small hobby/gearmotor rotor. A gearbox adds friction that grows with its ratio, so geared motors stop when unpowered.
  motor:{R:2,L:1e-3,k:0.01,J:2e-7,bv:1e-6,Tf:1e-4,load:0,gear:30},
  // electromagnet: N turns on a 1 cm² core, coil R+L, spring-return steel armature (rest gap, spring, mass); buzz = contact breaks when pulled in
  magnet:{N:300,R:10,L:0.02,gap:0.004,ks:20,m:0.005,buzz:false},
  // logic: output is a 0/HIGH source to the 0 V reference through Rout; inputs read HIGH above 60 % / LOW below 40 % of HIGH (hysteresis)
  gate:{kind:'AND',vh:5,rout:25,delay:0.01},
  not:{vh:5,rout:25,delay:0.01},
  // relay: coil (pins 3,4) pulls a spring-loaded armature that closes the contacts (pins 1,2); nc = contacts open when pulled
  relay:{N:2000,R:200,L:0.1,gap:0.001,ks:30,m:0.002,pre:0.01,nc:false},
  // push button / bump sensor: closed while pressed by a finger or by a body touching its cap
  button:{nc:false,reach:22}
};
const MU0=4e-7*Math.PI,CORE_AREA=1e-4,GAP_LEAK=5e-4,BSAT=1.8;
// Pull of a coil on steel across gap g (m): B = μ0·N·I/(g+leak), capped at the steel's saturation (1.8 T); F = B²·A/(2μ0).
// Below saturation this is the usual μ0·A·(NI)²/(2(g+leak)²); above it the pull tops out (~130 N on a 1 cm² core).
function magB(ni,g){return Math.min(BSAT,MU0*Math.abs(ni)/(g+GAP_LEAK));}
function magPull(ni,g){const B=magB(ni,g);return B*B*CORE_AREA/(2*MU0);}
const LED_COLORS={
  red:{Vf:1.8,rgb:[255,60,40]}, amber:{Vf:2.0,rgb:[255,165,20]},
  green:{Vf:2.1,rgb:[90,240,110]}, blue:{Vf:3.0,rgb:[70,130,255]}, white:{Vf:3.0,rgb:[240,240,255]}
};
function rot(x,y,r){switch(r&3){case 0:return[x,y];case 1:return[-y,x];case 2:return[-x,-y];default:return[y,-x];}}
function pinLocal(t){
  if(t==='ground')return[[0,-20]];
  if(t==='gate')return[[-30,-10],[-30,10],[30,0]];            // A, B, OUT
  if(t==='relay')return[[-30,-10],[30,-10],[-30,10],[30,10]];  // contact, contact, coil, coil
  return[[-30,0],[30,0]];                                      // two-pin parts (NOT = in, out)
}
const GATE_OUT={gate:2,not:1};
function gateEval(kind,a,b){switch(kind){case 'AND':return a&&b;case 'OR':return a||b;case 'XOR':return a!==b;
  case 'NAND':return !(a&&b);case 'NOR':return !(a||b);case 'XNOR':return a===b;}return false;}
function pinWorld(c,i){const l=pinLocal(c.type)[i];let q=rot(l[0],l[1],c.rot);const a=c.ang||0;
  if(a){const cs=Math.cos(a),sn=Math.sin(a);q=[q[0]*cs-q[1]*sn,q[0]*sn+q[1]*cs];}return{x:c.x+q[0],y:c.y+q[1]};}
function endKey(e){return e.pin?'p'+e.pin.c+'_'+e.pin.i:'f'+Math.round(e.x)+'_'+Math.round(e.y);}
function pnjlim(vnew,vold,vt,vcrit){
  if(vnew>vcrit&&Math.abs(vnew-vold)>2*vt){
    if(vold>0){const arg=1+(vnew-vold)/vt;vnew=arg>0?vold+vt*Math.log(arg):vcrit;}
    else vnew=vt*Math.log(vnew/vt);
  }
  return vnew;
}
function gauss(A,b,n){
  for(let c=0;c<n;c++){
    let p=c,m=Math.abs(A[c][c]);
    for(let r=c+1;r<n;r++){const v=Math.abs(A[r][c]);if(v>m){m=v;p=r;}}
    if(!(m>1e-300))return null;
    if(p!==c){const t=A[p];A[p]=A[c];A[c]=t;const tb=b[p];b[p]=b[c];b[c]=tb;}
    const rc=A[c],piv=rc[c];
    for(let r=c+1;r<n;r++){const rr=A[r];const f=rr[c]/piv;if(f===0)continue;
      for(let k=c;k<n;k++)rr[k]-=f*rc[k];b[r]-=f*b[c];}
  }
  const x=new Float64Array(n);
  for(let r=n-1;r>=0;r--){let s=b[r];const rr=A[r];for(let k=r+1;k<n;k++)s-=rr[k]*x[k];x[r]=s/rr[r];}
  for(let i=0;i<n;i++)if(!isFinite(x[i]))return null;
  return x;
}
function armature(c,I,dt,pre){ // spring-return steel armature pulled by the coil (shared by magnet and relay)
  const p=c.p,sub=4,h=dt/sub;let F=0;
  for(let s=0;s<sub;s++){
    F=magPull(p.N*I,c.g);
    const acc=(p.ks*(p.gap-c.g)+pre-F)/Math.max(p.m,1e-4)-30*c.gv;
    c.gv+=acc*h;c.g+=c.gv*h;
    if(c.g<=0){c.g=0;if(c.gv<0)c.gv=-c.gv*0.15;}
    if(c.g>p.gap*2){c.g=p.gap*2;if(c.gv>0)c.gv=0;}
  }
  c.F=F;
}
function solve(st,dt,o,commit){
  const comps=st.comps,wires=st.wires;
  const gnd=new Set();
  for(const c of comps)if(c.type==='ground')gnd.add('p'+c.id+'_0');
  const idx=new Map();let n=0;
  const node=k=>{if(gnd.has(k))return -1;let i=idx.get(k);if(i===undefined){i=n++;idx.set(k,i);}return i;};
  const els=[];const wg=1/Math.max(o.wireR,1e-5);
  for(const c of comps){
    if(c.type==='ground')continue;
    const a=node('p'+c.id+'_0'),b=node('p'+c.id+'_1'),p=c.p;
    if(c.type==='resistor')els.push({t:'G',a,b,g:1/Math.max(p.R,1e-3),c});
    else if(c.type==='switch')els.push({t:'G',a,b,g:p.closed?wg:0,c});
    else if(c.type==='battery')els.push({t:'B',a,b,V:p.V,g:1/Math.max(p.r,1e-4),c});
    else if(c.type==='capacitor'){if(!isFinite(c.vc))c.vc=0;els.push({t:'C',a,b,g:Math.max(p.C,1e-12)/dt,c});}
    else if(c.type==='led'||c.type==='diode'){
      if(c.burnt){els.push({t:'G',a,b,g:0,c});continue;}
      const m=node('i'+c.id);
      const nVt=(c.type==='led'?2.0:1.6)*VT;
      const Iref=c.type==='led'?0.02:0.01;
      const Is=Iref/Math.expm1(Math.max(p.Vf,0.05)/nVt);
      const vcrit=nVt*Math.log(nVt/(Math.SQRT2*Is));
      if(!isFinite(c.vd))c.vd=0;
      els.push({t:'G',a,b:m,g:1/Math.max(p.Rs,1e-3),c});
      els.push({t:'D',a:m,b,Is,nVt,vcrit,c});
    }
    else if(c.type==='motor'){
      for(const k of ['ip','wp','theta'])if(!isFinite(c[k]))c[k]=0;
      if(!isFinite(c.wIt))c.wIt=c.wp;
      const G=1/(Math.max(p.R,1e-3)+Math.max(p.L,0)/dt);
      els.push({t:'M',a,b,w:node('m'+c.id),c,G,cc:(Math.max(p.L,0)/dt)*c.ip});
    }
    else if(c.type==='magnet'){
      if(!isFinite(c.ip))c.ip=0;if(!isFinite(c.g))c.g=p.gap;if(!isFinite(c.gv))c.gv=0;
      const open=!!(p.buzz&&c.broken);
      const G=open?0:1/(Math.max(p.R,1e-3)+Math.max(p.L,0)/dt);
      els.push({t:'L',a,b,c,G,cc:open?0:(Math.max(p.L,0)/dt)*c.ip,open,ik:'I',pk:'ip'});
    }
    else if(c.type==='gate'||c.type==='not'){
      if(!isFinite(c.vout))c.vout=0;
      const o=node('p'+c.id+'_'+GATE_OUT[c.type]);
      els.push({t:'Q',a:o,b:-1,g:1/Math.max(p.rout,0.1),V:c.vout,c,ng:true});
    }
    else if(c.type==='relay'){
      if(!isFinite(c.ipc))c.ipc=0;if(!isFinite(c.g))c.g=p.gap;if(!isFinite(c.gv))c.gv=0;
      const pulled=c.g<3e-4,closed=p.nc?!pulled:pulled;c.closed=closed;
      els.push({t:'G',a,b,g:closed?wg:0,c});
      const ca=node('p'+c.id+'_2'),cb=node('p'+c.id+'_3'),G=1/(Math.max(p.R,1e-3)+Math.max(p.L,0)/dt);
      els.push({t:'L',a:ca,b:cb,c,G,cc:(Math.max(p.L,0)/dt)*c.ipc,open:false,ik:'Ic',pk:'ipc'});
    }
    else if(c.type==='button'){
      const closed=p.nc?!c.pressed:!!c.pressed;c.closed=closed;
      els.push({t:'G',a,b,g:closed?wg:0,c});
    }
  }
  for(const w of wires)els.push({t:'W',a:node(endKey(w.a)),b:node(endKey(w.b)),g:wg,w});

  // Anchor every island that has no Ground part: tie ONE node (its battery − if it has one) to 0 V.
  // A single tie carries no current, so physics is unchanged, but the island's common-mode level becomes
  // well defined instead of floating on gmin — that float is what made Newton chatter at µV level forever.
  const par=new Int32Array(n);for(let i=0;i<n;i++)par[i]=i;
  const find=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i];}return i;};
  const uni=(i,j)=>{if(i>=0&&j>=0){i=find(i);j=find(j);if(i!==j)par[i]=j;}};
  const live=e=>!((e.t==='G'&&!(e.g>0))||(e.t==='L'&&e.open));
  const touch=[],touchQ=[];
  for(const e of els){if(!live(e))continue;uni(e.a,e.b);if(e.t==='M')uni(e.a,e.w);
    if(e.ng){if(e.a>=0)touchQ.push(e.a);continue;} // gate outputs: see below
    if(e.a<0&&e.b>=0)touch.push(e.b);else if(e.b<0&&e.a>=0)touch.push(e.a);}
  const grounded=new Set(touch.map(find)),ref=new Map();
  for(const e of els)if(e.t==='B'&&e.a>=0){const r=find(e.a);if(!grounded.has(r)&&!ref.has(r))ref.set(r,e.a);}
  // An island driven only by gate outputs (no battery) is already referenced to 0 V through those outputs.
  // An island with a battery still anchors at the battery's − so the gates' return current has a path.
  const qDriven=new Set(touchQ.map(find));
  for(let i=0;i<n;i++){const r=find(i);if(!grounded.has(r)&&!ref.has(r)&&!qDriven.has(r))ref.set(r,i);}
  const refNodes=[...ref.values()];
  const x=new Float64Array(n);
  if(st.prevV)for(const [k,i] of idx){const v=st.prevV.get(k);if(v!==undefined)x[i]=v;}
  const V=i=>i<0?0:x[i];
  const A=[];for(let i=0;i<n;i++)A.push(new Float64Array(n));
  const rhs=new Float64Array(n);

  const wt=new Float32Array(b.n),size=Math.sqrt(Math.abs(b.area0)),R=Math.max(1e-3,E.jointSpread*size);
  let s2=0;
  for(let j=0;j<b.n;j++){
    const w=(E.jointSpread<=0)?(j===i?1:0):Math.exp(-((b.qx[j]-b.qx[i])**2+(b.qy[j]-b.qy[i])**2)/(R*R));
    wt[j]=w;s2+=w*w;}
  return {b,i,wt,is:1/Math.max(1,s2)};
}
function anchorXY(a){return {x:a.b.x[a.i],y:a.b.y[a.i]};}
function createJoint(sa,sb,type,restOverride){
  if(E.joints.length>=MAX_JOINTS)return null;
  if(!sa.b&&!sb.b)return null;
  if(!sa.b){const t=sa;sa=sb;sb=t;}
  if(sb.b&&sb.b===sa.b)return null;
  const a=makeAnchor(sa.b,sa.i),bA=sb.b?makeAnchor(sb.b,sb.i):null;
  const ax=sa.b.x[sa.i],ay=sa.b.y[sa.i];
  const bx=sb.b?sb.b.x[sb.i]:sb.wx,by=sb.b?sb.b.y[sb.i]:sb.wy;
  const rest=(restOverride>0)?restOverride:Math.max(4,Math.hypot(bx-ax,by-ay))*(1+E.jointSlack);
  const j={id:E.jid++,type:type==='rope'?'rope':'rod',a,b:bA,wx:bx,wy:by,rest,peak:0};
  E.joints.push(j);return j;
}
function removeJoint(j){const i=E.joints.indexOf(j);if(i>=0)E.joints.splice(i,1);}
function jointEnds(j,useR){
  const A=j.a.b,B=j.b?j.b.b:null;
  const ax=useR?A.rx[j.a.i]:A.x[j.a.i],ay=useR?A.ry[j.a.i]:A.y[j.a.i];
  const bx=B?(useR?B.rx[j.b.i]:B.x[j.b.i]):j.wx,by=B?(useR?B.ry[j.b.i]:B.y[j.b.i]):j.wy;
  return [ax,ay,bx,by];
}
function jointAt(x,y){
  const tol=Math.max(8,14/(V.s||1));let best=null,bd=tol;
  for(const j of E.joints){
    const [ax,ay,bx,by]=jointEnds(j,false),dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
    let t=l2>1e-9?((x-ax)*dx+(y-ay)*dy)/l2:0;t=t<0?0:(t>1?1:t);
    const d=Math.hypot(x-(ax+dx*t),y-(ay+dy*t));
    if(d<bd){bd=d;best=j;}
  }
  return best;
}
function applyAnchor(an,mx,my){const b=an.b,wt=an.wt;for(let j=0;j<b.n;j++){const ww=wt[j];if(ww>0.002){b.x[j]+=mx*ww;b.y[j]+=my*ww;}}}
function solveJoints(first){
  const J=E.joints,f=E.jf;
  for(let q=0;q<J.length;q++){
    const j=J[q],A=j.a,B=j.b;
    const ax=A.b.x[A.i],ay=A.b.y[A.i];
    const bx=B?B.b.x[B.i]:j.wx,by=B?B.b.y[B.i]:j.wy;
    const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);
    if(len<1e-6)continue;
    const C=len-j.rest;
    if(first){const st=(j.type==='rope'?Math.max(0,C):Math.abs(C))/j.rest*E.substeps;if(st>j.peak)j.peak=st;}   // strain per frame this joint was asked to absorb
    if(C<=0&&j.type==='rope')continue;
    const wa=A.b.w*A.is,wb=B?B.b.w*B.is:0,ws=wa+wb;
    if(ws<=0)continue;
    const lam=C/len*f/ws;
    applyAnchor(A,dx*lam*wa,dy*lam*wa);
    if(B)applyAnchor(B,-dx*lam*wb,-dy*lam*wb);
  }
}
function refreshJoints(){
  const J=E.joints;
  if(!J.length){if(E.linked.size)E.linked.clear();return;}
  const alive=new Set(E.bodies);
  for(let q=J.length-1;q>=0;q--){const j=J[q];if(!alive.has(j.a.b)||(j.b&&!alive.has(j.b.b)))J.splice(q,1);}
  E.linked.clear();
  for(const j of J)if(j.b){const x=j.a.b.id,y=j.b.b.id;E.linked.add(x<y?x*100003+y:y*100003+x);}
}
let jointSnapped=0;
function breakJoints(){
  if(!(E.jointBreak>0))return;
  const J=E.joints;
  for(let q=J.length-1;q>=0;q--){const j=J[q],e=jointEnds(j,false);
    const now=(Math.hypot(e[2]-e[0],e[3]-e[1])-j.rest)/j.rest;      // elastic joints really do stretch
    if(j.peak>E.jointBreak||now>E.jointBreak){J.splice(q,1);jointSnapped=performance.now();}
    else j.peak=0;}
}

/* ── solver ── */
function integrate(h){
  const dmp=1-Math.min(0.99,E.drag*h),gh=E.gravity*h;
  for(const b of E.bodies)for(let i=0;i<b.n;i++){
    let vx=b.vx[i]*dmp,vy=b.vy[i]*dmp+gh;
    b.px[i]=b.x[i];b.py[i]=b.y[i];
    b.vx[i]=vx;b.vy[i]=vy;
    b.x[i]+=vx*h;b.y[i]+=vy*h;
  }
}
function solveBody(b){
  const n=b.n,x=b.x,y=b.y;
  if(b.kE>0){
    const ke=b.kE;
    for(let sw=0;sw<E.skinSweeps;sw++)
    for(let t=0;t<n;t++){const i=((E.parity+sw)&1)?t:n-1-t,j=(i+1)%n;
      const dx=x[j]-x[i],dy=y[j]-y[i],len=Math.hypot(dx,dy)||1e-6;
      const c=0.5*(len-b.L0[i])/len*ke;
      x[i]+=dx*c;y[i]+=dy*c;x[j]-=dx*c;y[j]-=dy*c;}
  }
  if(b.kP>0){
    let A=0,sumG=0;
    for(let i=0;i<n;i++){const j=(i+1)%n;A+=x[i]*y[j]-x[j]*y[i];}
    A*=0.5;
    for(let i=0;i<n;i++){const ip=(i+1)%n,im=(i-1+n)%n;
      const gx=0.5*(y[ip]-y[im]),gy=0.5*(x[im]-x[ip]);b.gx[i]=gx;b.gy[i]=gy;sumG+=gx*gx+gy*gy;}
    if(sumG>1e-9){const lam=-(A-b.area0*b.mat.inflate)/sumG*b.kP;
      for(let i=0;i<n;i++){x[i]+=lam*b.gx[i];y[i]+=lam*b.gy[i];}}
  }
  if(b.kS>0){
    let cx=0,cy=0;for(let i=0;i<n;i++){cx+=x[i];cy+=y[i];}cx/=n;cy/=n;
    let dot=0,crs=0;
    for(let i=0;i<n;i++){const p=x[i]-cx,q=y[i]-cy;dot+=b.qx[i]*p+b.qy[i]*q;crs+=b.qx[i]*q-b.qy[i]*p;}
    const th=Math.atan2(crs,dot),c=Math.cos(th),s=Math.sin(th),ks=b.kS;
    for(let i=0;i<n;i++){const gx=cx+c*b.qx[i]-s*b.qy[i],gy=cy+s*b.qx[i]+c*b.qy[i];
      x[i]+=(gx-x[i])*ks;y[i]+=(gy-y[i])*ks;}
  }
}
function addContact(P,i,Q,j,k,t,nx,ny,vn,e){
  let c=contacts[nContacts];
  if(!c){c={P:null,i:0,Q:null,j:0,k:0,t:0,nx:0,ny:0,vn:0,e:0};contacts[nContacts]=c;}
  nContacts++;
  c.P=P;c.i=i;c.Q=Q;c.j=j;c.k=k;c.t=t;c.nx=nx;c.ny=ny;c.vn=vn;c.e=e;
}
function wallHit(b,i,nx,ny,pen,rec){
  b.x[i]+=nx*pen;b.y[i]+=ny*pen;
  const tx=-ny,ty=nx;
  const dtg=(b.x[i]-b.px[i])*tx+(b.y[i]-b.py[i])*ty;
  const maxf=b.mat.friction*pen,a=Math.abs(dtg);
  const c=a<=maxf?dtg:(dtg>0?maxf:-maxf);
  b.x[i]-=tx*c;b.y[i]-=ty*c;
  if(rec)addContact(b,i,null,0,0,0,nx,ny,b.vx[i]*nx+b.vy[i]*ny,b.mat.bounce);
}
function collideWalls(rec){
  const W=E.W,H=E.H;
  for(const b of E.bodies)for(let i=0;i<b.n;i++){
    const x=b.x[i],y=b.y[i];
    if(y>H)wallHit(b,i,0,-1,y-H,rec);else if(y<0)wallHit(b,i,0,1,-y,rec);
    if(x>W)wallHit(b,i,-1,0,x-W,rec);else if(x<0)wallHit(b,i,1,0,-x,rec);
  }
}
function nodesVsBody(P,Q,rec,h){
  const nq=Q.n,qX=Q.x,qY=Q.y;
  for(let i=0;i<P.n;i++){
    const x=P.x[i],y=P.y[i];
    if(x<Q.minx||x>Q.maxx||y<Q.miny||y>Q.maxy)continue;
    if(!pip(x,y,qX,qY,nq))continue;
    let bd=1e18,bj=0,bt=0,bqx=0,bqy=0;
    for(let j=0;j<nq;j++){const k=(j+1===nq)?0:j+1;
      const ex=qX[k]-qX[j],ey=qY[k]-qY[j],l2=ex*ex+ey*ey;
      let t=l2>1e-12?((x-qX[j])*ex+(y-qY[j])*ey)/l2:0;t=t<0?0:(t>1?1:t);
      const cx=qX[j]+ex*t,cy=qY[j]+ey*t,dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;
      if(d2<bd){bd=d2;bj=j;bt=t;bqx=cx;bqy=cy;}}
    let nx=bqx-x,ny=bqy-y,d=Math.hypot(nx,ny);
    if(d<1e-6){nx=x-Q.cx;ny=y-Q.cy;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;d=1e-6;}else{nx/=d;ny/=d;}
    if(d>5){ // deep interpenetration: nearest-edge normals become ambiguous — bias toward "away from the other body's centre"
      let cxn=x-Q.cx,cyn=y-Q.cy;const cl=Math.hypot(cxn,cyn)||1;cxn/=cl;cyn/=cl;
      let bx=nx+1.5*cxn,by=ny+1.5*cyn;const bl=Math.hypot(bx,by)||1;nx=bx/bl;ny=by/bl;
    }
    const k=(bj+1===nq)?0:bj+1,t=bt;
    const vqx=(1-t)*Q.vx[bj]+t*Q.vx[k],vqy=(1-t)*Q.vy[bj]+t*Q.vy[k];
    const vn=(P.vx[i]-vqx)*nx+(P.vy[i]-vqy)*ny;
    let push=Math.min(d,Math.max(0.2,2*Math.max(0,-vn)*h));
    if(d>5)push*=DEEP_PUSH; // many nodes resolve at once when deeply overlapped — keep the recovery gentle
    const wp=P.w,wi=Q.w,wq=wi*((1-t)*(1-t)+t*t),lam=push/(wp+wq);
    P.x[i]+=wp*lam*nx;P.y[i]+=wp*lam*ny;
    Q.x[bj]-=wi*(1-t)*lam*nx;Q.y[bj]-=wi*(1-t)*lam*ny;
    Q.x[k]-=wi*t*lam*nx;Q.y[k]-=wi*t*lam*ny;
    // Coulomb friction on the tangential displacement
    const tx=-ny,ty=nx;
    const rdx=(P.x[i]-P.px[i])-((1-t)*(Q.x[bj]-Q.px[bj])+t*(Q.x[k]-Q.px[k]));
    const rdy=(P.y[i]-P.py[i])-((1-t)*(Q.y[bj]-Q.py[bj])+t*(Q.y[k]-Q.py[k]));
    const dtg=rdx*tx+rdy*ty,mu=Math.sqrt(P.mat.friction*Q.mat.friction),maxf=mu*push,a=Math.abs(dtg);
    const cf=a<=maxf?dtg:(dtg>0?maxf:-maxf),lt=cf/(wp+wq);
    P.x[i]-=wp*lt*tx;P.y[i]-=wp*lt*ty;
    Q.x[bj]+=wi*(1-t)*lt*tx;Q.y[bj]+=wi*(1-t)*lt*ty;
    Q.x[k]+=wi*t*lt*tx;Q.y[k]+=wi*t*lt*ty;
    if(rec)addContact(P,i,Q,bj,k,t,nx,ny,vn,(P.mat.bounce+Q.mat.bounce)*0.5);
  }
}
function collideBodies(rec,h){
  const B=E.bodies;
  for(const b of B)updateAABB(b);
  for(let a=0;a<B.length;a++)for(let c=a+1;c<B.length;c++){
    const A=B[a],C=B[c];
    if(A.maxx<C.minx||C.maxx<A.minx||A.maxy<C.miny||C.maxy<A.miny)continue;
    if(E.joints.length&&!E.jointCollide&&E.linked.has(A.id<C.id?A.id*100003+C.id:C.id*100003+A.id))continue;   // linked bodies pass through each other
    nodesVsBody(A,C,rec,h);nodesVsBody(C,A,rec,h);
  }
}
function updateVelocities(h){
  for(const b of E.bodies){
    const n=b.n,inv=1/h;
    for(let i=0;i<n;i++){
      let vx=(b.x[i]-b.px[i])*inv,vy=(b.y[i]-b.py[i])*inv;
      const m=Math.hypot(vx,vy);if(m>VMAX){const s=VMAX/m;vx*=s;vy*=s;}
      b.vx[i]=vx;b.vy[i]=vy;
    }
    if(b.kD>0){ // damp only the internal (non-rigid) part of the motion → wobble dies, momentum stays
      let cx=0,cy=0,vcx=0,vcy=0;
      for(let i=0;i<n;i++){cx+=b.x[i];cy+=b.y[i];vcx+=b.vx[i];vcy+=b.vy[i];}
      cx/=n;cy/=n;vcx/=n;vcy/=n;
      let L=0,I=0;
      for(let i=0;i<n;i++){const rx=b.x[i]-cx,ry=b.y[i]-cy;L+=rx*(b.vy[i]-vcy)-ry*(b.vx[i]-vcx);I+=rx*rx+ry*ry;}
      const w=I>1e-6?L/I:0,kd=b.kD;
      for(let i=0;i<n;i++){const rx=b.x[i]-cx,ry=b.y[i]-cy;
        b.vx[i]+=(vcx-w*ry-b.vx[i])*kd;b.vy[i]+=(vcy+w*rx-b.vy[i])*kd;}
    }
  }
}
function restitution(){
  for(let q=0;q<nContacts;q++){
    const c=contacts[q];
    if(c.vn>=-REST_THRESH||c.e<=0)continue;
    const P=c.P,nx=c.nx,ny=c.ny;
    if(!c.Q){
      const vnNow=P.vx[c.i]*nx+P.vy[c.i]*ny,target=-c.e*c.vn;
      if(vnNow<target){const dv=target-vnNow;P.vx[c.i]+=nx*dv;P.vy[c.i]+=ny*dv;}
    }else{
      const Q=c.Q,j=c.j,k=c.k,t=c.t;
      const vqx=(1-t)*Q.vx[j]+t*Q.vx[k],vqy=(1-t)*Q.vy[j]+t*Q.vy[k];
      const vnNow=(P.vx[c.i]-vqx)*nx+(P.vy[c.i]-vqy)*ny,target=-c.e*c.vn;
      if(vnNow<target){
        const wp=P.w,wi=Q.w,wq=wi*((1-t)*(1-t)+t*t),lam=(target-vnNow)/(wp+wq);
        P.vx[c.i]+=wp*lam*nx;P.vy[c.i]+=wp*lam*ny;
        Q.vx[j]-=wi*(1-t)*lam*nx;Q.vy[j]-=wi*(1-t)*lam*ny;
        Q.vx[k]-=wi*t*lam*nx;Q.vy[k]-=wi*t*lam*ny;
      }
    }
  }
}
/* ── ropes & chains ──
   A rope is a string of round nodes (radius r). Consecutive nodes keep their link length; each node collides
   with bodies through the same push-out + Coulomb friction used between bodies, and pushes back on the body,
   so a spinning wheel drags it and it can't pass through anything. Ends can hang on body points or world pins;
   a closed rope also links its last node back to its first. */
function makeRope(pts,opt){
  opt=opt||{};if(E.ropes.length>=MAX_ROPES)return null;
  const n=Math.min(pts.length,MAX_ROPE_NODES);if(n<2)return null;
  const F=()=>new Float64Array(n);
  const R={id:E.rid++,n,x:F(),y:F(),px:F(),py:F(),vx:F(),vy:F(),skip:new Int32Array(n).fill(-1),
    closed:!!opt.closed&&n>=4,rest:opt.rest||6,len:opt.len||1,r:opt.r||3,mass:opt.mass||0.04,grip:opt.grip===undefined?0.9:opt.grip,
    stretch:opt.stretch||0,style:opt.style||'chain',att:[],grab:null};
  for(let i=0;i<n;i++){R.x[i]=R.px[i]=pts[i][0];R.y[i]=R.py[i]=pts[i][1];}
  E.ropes.push(R);return R;
}
function removeRope(R){const i=E.ropes.indexOf(R);if(i>=0)E.ropes.splice(i,1);}
function ropeSkip(R){ // nodes next to a body attachment don't collide with that body (they sit on its surface by design)
  R.skip.fill(-1);
  for(const a of R.att){if(!a.an)continue;for(let d=-3;d<=3;d++){let k=a.i+d;if(R.closed)k=(k+R.n)%R.n;if(k>=0&&k<R.n)R.skip[k]=a.an.b.id;}}
}
function attachRope(R,i,b,j){
  R.att=R.att.filter(a=>a.i!==i);
  if(b)R.att.push({i,an:makeAnchor(b,j),j});ropeSkip(R);
}
function pinRope(R,i,wx,wy){R.att=R.att.filter(a=>a.i!==i);R.att.push({i,wx,wy});ropeSkip(R);}
function unattachRope(R,i){R.att=R.att.filter(a=>a.i!==i);ropeSkip(R);}
function ropeDropBody(b){for(const R of E.ropes){const k=R.att.length;R.att=R.att.filter(a=>!a.an||a.an.b!==b);if(R.att.length!==k)ropeSkip(R);}}
function ropeLength(R){let L=0;const m=R.closed?R.n:R.n-1;for(let i=0;i<m;i++){const j=(i+1)%R.n;L+=Math.hypot(R.x[j]-R.x[i],R.y[j]-R.y[i]);}return L;}
function integrateRopes(h){
  const dmp=1-Math.min(0.5,E.ropeDrag*h),gh=E.gravity*h;
  for(const R of E.ropes)for(let i=0;i<R.n;i++){
    R.px[i]=R.x[i];R.py[i]=R.y[i];R.vx[i]*=dmp;R.vy[i]=R.vy[i]*dmp+gh;R.x[i]+=R.vx[i]*h;R.y[i]+=R.vy[i]*h;}
}
function ropeNodeVsBody(R,i,Q,wp){
  const x=R.x[i],y=R.y[i],r=R.r;
  if(x<Q.minx-r||x>Q.maxx+r||y<Q.miny-r||y>Q.maxy+r)return;
  const nq=Q.n,qX=Q.x,qY=Q.y;
  let bd=1e18,bj=0,bt=0,bqx=0,bqy=0;
  for(let j=0;j<nq;j++){const k=(j+1===nq)?0:j+1;
    const ex=qX[k]-qX[j],ey=qY[k]-qY[j],l2=ex*ex+ey*ey;
    let t=l2>1e-12?((x-qX[j])*ex+(y-qY[j])*ey)/l2:0;t=t<0?0:(t>1?1:t);
    const cx=qX[j]+ex*t,cy=qY[j]+ey*t,dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;
    if(d2<bd){bd=d2;bj=j;bt=t;bqx=cx;bqy=cy;}}
  const inside=pip(x,y,qX,qY,nq);let d=Math.sqrt(bd),nx,ny,pen;
  if(inside){ // push out through the nearest edge, plus the node's radius
    if(d<1e-6){nx=x-Q.cx;ny=y-Q.cy;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;}else{nx=(bqx-x)/d;ny=(bqy-y)/d;}
    if(d>5){let cxn=x-Q.cx,cyn=y-Q.cy;const cl=Math.hypot(cxn,cyn)||1;cxn/=cl;cyn/=cl;
      let bx=nx+1.5*cxn,by=ny+1.5*cyn;const bl=Math.hypot(bx,by)||1;nx=bx/bl;ny=by/bl;}
    pen=d+r;if(d>5)pen*=DEEP_PUSH;

  const k=(bj+1===nq)?0:bj+1,t=bt,wi=Q.w,wq=wi*((1-t)*(1-t)+t*t),lam=pen/(wp+wq);
  R.x[i]+=wp*lam*nx;R.y[i]+=wp*lam*ny;
  Q.x[bj]-=wi*(1-t)*lam*nx;Q.y[bj]-=wi*(1-t)*lam*ny;Q.x[k]-=wi*t*lam*nx;Q.y[k]-=wi*t*lam*ny;
  // Coulomb friction on the sliding motion between the node and the surface: grip 1 = drags along, 0 = slides freely
  const tx=-ny,ty=nx;
  const rdx=(R.x[i]-R.px[i])-((1-t)*(Q.x[bj]-Q.px[bj])+t*(Q.x[k]-Q.px[k]));
  const rdy=(R.y[i]-R.py[i])-((1-t)*(Q.y[bj]-Q.py[bj])+t*(Q.y[k]-Q.py[k]));
  const dtg=rdx*tx+rdy*ty,mu=Math.sqrt(Math.max(0,R.grip)*Q.mat.friction),maxf=mu*pen,a=Math.abs(dtg);
  const cf=a<=maxf?dtg:(dtg>0?maxf:-maxf),lt=cf/(wp+wq);
  R.x[i]-=wp*lt*tx;R.y[i]-=wp*lt*ty;
  Q.x[bj]+=wi*(1-t)*lt*tx;Q.y[bj]+=wi*(1-t)*lt*ty;Q.x[k]+=wi*t*lt*tx;Q.y[k]+=wi*t*lt*ty;
}
function solveRopes(){

  else{poly=[];for(let i=0;i<b.n;i++){const qx=b.qx[i]*k,qy=b.qy[i]*k;poly.push([qx*cs-qy*sn,qx*sn+qy*cs]);}}

function bodySnap(p){ // center of a body first (generous), else the nearest point on its edge

function finishRope(raw){

  if(total<sp*3){flash('TOO SHORT — drag a longer line');return;}
  const closed=total>sp*12&&Math.hypot(e0.x-s0.x,e0.y-s0.y)<Math.max(26/view.s,sp*3);
  const path=closed?raw.concat([s0]):raw;

function fmtSI(v,u,d){
  d=d||3;if(!isFinite(v))return '—';const a=Math.abs(v);if(a<1e-12)return '0 '+u;
  const pre=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
  for(const [m,s] of pre){if(a>=m*0.9995||m===1e-12){let t=(v/m).toPrecision(d);if(t.includes('.')&&!t.includes('e'))t=t.replace(/0+$/,'').replace(/\.$/,'');return t+' '+s+u;}}
}
const DESC_BODY_TIP='Tap on the bench to place · drag to move (even paused) · flick to throw · ↻ rotates · AXL makes it spin in place.';
const DESC={
  battery:'Pushes current out of its + end, around the loop, and back into −. Voltage is how hard it pushes; internal resistance limits how much current it can give.',
  resistor:'Limits current: more ohms, less current (I = V ÷ R). Put one in series with an LED so the LED doesn\'t burn out.',
  led:'Lights when current flows from the triangle side (anode) into the bar (cathode). Needs about 2–3 V to turn on and burns out above its max current.',
  diode:'A one-way valve: current flows triangle → bar and is blocked the other way. Costs about 0.7 V when it conducts.',
  capacitor:'A tiny charge tank. Fills up through a resistor over time, then gives the charge back. Bigger capacitance = slower to fill and empty.',
  switch:'Opens or closes the loop. Tap it twice, or use the ON/OFF handle.',
  ground:'The 0 V reference that voltages are measured from. Optional: without one, each battery\'s − end is used.',
  motor:'Turns current into spin. Spinning pushes back on the battery (back-EMF), so a free motor draws little current and a stalled one draws a lot. Drop it on a body to make that body its rotor.',
  magnet:'A coil wrapped around a steel core. Current makes a magnetic pull that is strong up close and fades fast with distance. Pulls its armature and nearby STEEL bodies.',
  gate:'A logic gate. Reads each input as HIGH or LOW (above or below half its HIGH voltage, measured from 0 V) and drives its output HIGH or LOW. AND: both. OR: either. XOR: exactly one. NAND/NOR/XNOR: the opposite. It can light an LED through a resistor but can\'t power a motor; use a relay for that.',
  not:'Flips its input: HIGH in gives LOW out, LOW in gives HIGH out. Three in a ring make a blinker, and the Delay slider sets the speed.',
  relay:'A small electromagnet that flips a switch. A weak signal on the coil (bottom pins) closes the contacts (top pins), which can carry a big load like a motor. Clicks in and out with a spring.',
  button:'Closed only while pressed: by your finger, or by any body resting on its cap (the dashed zone). That makes it a bump sensor that lets physics trigger your circuit.',
  rope:'A chain or rope made of small links. It collides with bodies, so it wraps around wheels instead of passing through, and Grip sets how hard a spinning wheel drags it. Star shapes catch it like sprocket teeth. Drag any link to pull it. Use Pin to fix a link to the bench.',
  wire:'Connects points with almost no resistance. Drag an end to re-attach it, drag the middle to bend it.',
  body:'A physical object from MATTER_LAB that lives on the bench. Parts dropped on it ride along; a motor dropped on it spins it.',
  pin:'Tap a body to pin it to the bench at that spot. It hangs and swings from there.'

function updateReadouts(){
  if(!sel)return;const o=sel.obj;const s=(id,t)=>{const e=$(id);if(e&&e.textContent!==t)e.textContent=t;};
  if(sel.kind==='body'){s('roM',bodyMass(o).toFixed(1)+' g');const f=M.bodyFrame(o),st=M.spinState(o,f.x,f.y);s('roS',Math.round(st.w*60/(2*Math.PI))+' rpm');return;}
  if(sel.kind==='rope'){s('roRL',M.ropeLength(o).toFixed(0)+' mm (rest '+(o.rest*o.len*(o.closed?o.n:o.n-1)).toFixed(0)+')');return;}
  if(sel.kind==='wire'){s('roI',fmtSI(Math.abs(o.I||0),'A'));s('roV',fmtSI(((o.Va||0)+(o.Vb||0))/2,'V'));return;}
  if(o.type==='ground')return;
  const dv=o.type==='battery'?o.Vp[1]-o.Vp[0]:o.Vp?o.Vp[0]-o.Vp[1]:0;
  s('roV',fmtSI(dv,'V'));s('roI',fmtSI(o.I||0,'A'));s('roP',fmtSI(o.P||0,'W'));
  if(o.type==='capacitor')s('roQ',fmtSI((o.vc||0)*o.p.C,'C'));
  if(o.type==='motor'){s('roW',Math.round((o.omega||0)*60/(2*Math.PI)).toLocaleString()+' rpm');s('roT',fmtSI(o.torque||0,'N·m'));s('roE',fmtSI(o.emf||0,'V'));}
  if(o.type==='gate'||o.type==='not'){const n=o.type==='gate'?2:1,st=o.inS||[];
    s('roIn',Array.from({length:n},(_,i)=>(o.type==='gate'?'AB'[i]+' ':'')+(st[i]?'1':'0')+' ('+(o.Vp?o.Vp[i]:0).toFixed(1)+'V)').join('  '));
    s('roOut',(o.state?'HIGH 1':'LOW 0')+' · '+(o.Vp?o.Vp[GATE_OUT[o.type]]:0).toFixed(2)+' V');}
  if(o.type==='relay'){s('roCoil',fmtSI(o.Ic||0,'A')+' · pull '+fmtSI(o.F||0,'N'));s('roCt',o.closed?'CLOSED':'open');}
  if(o.type==='button')s('roBt',(o.pressed?'PRESSED':'released')+' → '+(o.closed?'closed':'open'));
  if(o.type==='magnet'){s('roF',fmtSI(o.F||0,'N')+((o.B||0)>=BSAT-1e-6?' · core saturated':''));s('roG',((o.g||0)*1000).toFixed(2)+' mm'+(o.broken?' · contact open':''));}
}

function endPtr(e,cancel){

  if(a.mode==='rope'){if(!cancel)finishRope(a.pts);return;}
  if(a.mode==='rpress')return;
  if(a.mode==='rgrab'){a.R.grab=null;changed();return;}
  if(a.mode==='grab'){M.endGrab(a.id);changed();return;}
  if(a.mode==='bpress')return;

    const tr=a.trail,now=performance.now();let vx=0,vy=0;
    if(tr.length>=2&&now-tr[tr.length-1].t<80){const p0=tr[0],p1=tr[tr.length-1],dt=Math.max(0.016,(p1.t-p0.t)/1000);vx=(p1.x-p0.x)/dt;vy=(p1.y-p0.y)/dt;}

    if(sp>120&&!a.b.axle)for(let i=0;i<a.b.n;i++){a.b.vx[i]=vx;a.b.vy[i]=vy;}
    changed();buildSel();return;
  }
  if(a.mode==='move'){const sn=a.snap;autoAttach(a.hc);mountAt(a.hc);buildSel();changed();if(sn&&a.hc.type!=='motor')flash('SNAPPED TO '+sn.kind+' · '+NAMES[a.hc.type]+' MOUNTED',1.8);
    else if(sn)flash('MOTOR AT '+sn.kind+' OF '+sn.b.mat.name+' #'+sn.b.id+(sn.kind==='EDGE'?' · it swings like a crank':' · spins true'),2.2);return;}

    w[a.k]=r.end;changed();buildSel();

// ---------- simulation ----------
function simulate(dt){
  if(!S.comps.length){status=E.bodies.length||E.ropes.length?'OK':'EMPTY — pick a part in BUILD';if(set.playing&&(E.bodies.length||E.ropes.length)){applyPhys();M.stepFrame(dt);}return;}
  const o={wireR:set.wireR,gmin:1e-9,burnout:set.burnout};
  for(const c of S.comps){if(c.type!=='button')continue; // bump sensing: any body node inside the cap zone
    let hit=false;
    for(const b of E.bodies){M.updateAABB(b);const cr=Math.hypot(b.maxx-b.minx,b.maxy-b.miny)/2+40;if(Math.abs(b.cx-c.x)>cr||Math.abs(b.cy-c.y)>cr)continue;
      const a=-(c.rot*Math.PI/2+(c.ang||0)),cs=Math.cos(a),sn=Math.sin(a);
      const rch=Math.max(1,c.p.reach||22);
      for(let i=0;i<b.n&&!hit;i++){const dx=b.x[i]-c.x,dy=b.y[i]-c.y,lx=dx*cs-dy*sn,ly=dx*sn+dy*cs;if(lx>-16&&lx<16&&ly>-4-rch&&ly<-4)hit=true;}
      if(hit)break;}
    const pr=!!(c.fingerDown||hit);if(pr!==!!c.pressed){c.pressed=pr;touch();}}
  const hasCap=S.comps.some(c=>c.type==='capacitor'||c.type==='motor'||c.type==='magnet'||c.type==='gate'||c.type==='not'||c.type==='relay');
  let res=null;
  updateMounts();
  const drive=[];
  if(set.playing)for(const c of S.comps){ // motor ↔ rotor body: hand the body's spin + inertia to the circuit solve
    if(c.type!=='motor'||!c.shaft){c.Jext=0;continue;}const b=bodyById(c.shaft);if(!b||!b.axle){c.shaft=null;c.Jext=0;continue;}
    const st=M.spinState(b,b.axle.x,b.axle.y),gr=Math.max(1,c.p.gear);
    c.wp=st.w*gr;c.wIt=c.wp;c.Jext=st.I*1e-9/(gr*gr);drive.push({c,b,w0:st.w,gr,Ib:st.I*1e-9,Jr:Math.max(0,c.p.J)*gr*gr});
  }
  if(set.playing){
    const sdt=Math.max(1e-6,dt*set.timeScale);
    if(hasCap||S.ver!==solvedVer){
      const steps=hasCap?Math.min(8,Math.max(1,Math.ceil(sdt/(1/240)))):1;
      for(let k=0;k<steps;k++){res=solve(S,sdt/steps,o,true);
        if(res.burnt.length){flash('LED BURNT OUT — it needs a resistor in series',3);if(sel&&res.burnt.includes(sel.obj))buildSel();touch();}}
      solvedVer=S.ver;lastOk=res.ok;
    }
    simT+=sdt;
    for(const d of drive)if(lastOk){d.wSet=d.c.omega/d.gr;M.addSpin(d.b,d.b.axle.x,d.b.axle.y,d.wSet-d.w0);}
    magnetForces(sdt);
    if(E.bodies.length||E.ropes.length){applyPhys();M.stepFrame(dt);
      // Whatever the bench did to a driven body's spin (a load, a rope, a collision) is shared with the motor's
      // rotor inertia seen through the gearbox (J·gear²) — the body alone doesn't get to overwrite the motor's speed.
      for(const d of drive){if(d.wSet===undefined||!E.bodies.includes(d.b)||!d.b.axle)continue;
        const wA=M.spinState(d.b,d.b.axle.x,d.b.axle.y).w,wN=d.wSet+(wA-d.wSet)*d.Ib/Math.max(1e-30,d.Ib+d.Jr);
        M.addSpin(d.b,d.b.axle.x,d.b.axle.y,wN-wA);d.c.omega=wN*d.gr;}
      if(act&&act.mode==='bmove'&&act.target&&E.bodies.includes(act.b)){const f=M.bodyFrame(act.b);moveBodyBy(act.b,act.target.x-f.x,act.target.y-f.y,true);}
      updateMounts();}
  }else if(S.ver!==solvedVer){res=solve(S,1e-9,o,false);solvedVer=S.ver;lastOk=res.ok;}
  let st='OK';
  if(!lastOk)st='NOT CONVERGING';
  else if(S.comps.some(c=>c.type==='battery'&&Math.abs(c.I||0)>5))st='SHORT CIRCUIT';
  status=st;
}

function magnetPole(c){const q=rot(0,-12,c.rot),a=c.ang||0,cs=Math.cos(a),sn=Math.sin(a);return{x:c.x+q[0]*cs-q[1]*sn,y:c.y+q[0]*sn+q[1]*cs};}
function magnetForces(dt){ // real coil pull F = μ0·A·(N·I)²/(2(g+leak)²), with 1 px = 1 mm and body mass in grams

    if(c.type!=='magnet'||Math.abs(c.I||0)<1e-4)continue;
    const pole=magnetPole(c),ni=c.p.N*c.I;c.pullN=0;
    for(const b of E.bodies){

    const s=vert?toScreen(c.x+(c.type==='magnet'?40:22),c.y):toScreen(c.x,c.y-up);
    ctx.textAlign=vert?'left':'center';
    ctx.fillStyle=c.burnt?'#c0503a':'rgba(247,227,195,0.75)';ctx.fillText(lab,s.x,s.y);
  }
  ctx.textAlign='center';
  if(set.nodeLabels&&S.nodeV){const done=new Set();ctx.textAlign='left';ctx.fillStyle='#00e5ff';
    for(const c of S.comps){const n=pinLocal(c.type).length;for(let i=0;i<n;i++){const k='p'+c.id+'_'+i;if(done.has(k))continue;done.add(k);
      const v=S.nodeV.get(k);if(v===undefined)continue;const q=pinWorld(c,i),s=toScreen(q.x,q.y);ctx.fillText(v.toFixed(2)+'V',s.x+5,s.y-8);}}}
  if(act&&(act.mode==='wire'||act.mode==='rope'||(act.mode==='wend'&&act.moved))){
    const h=act.head,f=[...ptrs.values()][0];
    if(f&&set.touchOffset>4){ctx.strokeStyle='rgba(0,229,255,0.25)';ctx.lineWidth=1;line(f.x,f.y,h.x,h.y+11);}
    ctx.strokeStyle='#00e5ff';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(h.x,h.y,10,0,Math.PI*2);ctx.stroke();
    line(h.x-15,h.y,h.x-6,h.y);line(h.x+6,h.y,h.x+15,h.y);line(h.x,h.y-15,h.x,h.y-6);line(h.x,h.y+6,h.x,h.y+15);
    const sn=findSnap(toWorld(h.x,h.y),act.mode==='wend'?act.w:undefined);if(sn){const s=toScreen(sn.x,sn.y);ctx.strokeStyle='#ffb000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,7,0,Math.PI*2);ctx.stroke();}
    if(act.mode==='wire'&&act.pts.length===1){const sn0=findSnap(act.pts[0]);if(sn0){const s=toScreen(sn0.x,sn0.y);ctx.fillStyle='rgba(255,176,0,0.5)';ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill();}}
  }
}
function updateHud(){
  $('hT').textContent=simT.toFixed(2)+'s';$('hParts').textContent=S.comps.length;$('hWires').textContent=S.wires.length;
  const st=statusHold>0?statusMsg:status;const el=$('hStatus');el.textContent=(set.playing?'':'PAUSED · ')+st;
  el.className='seg grow '+((status==='SHORT CIRCUIT'||status==='NOT CONVERGING'||/BURNT/.test(st))?'warn':'hl');
  let s='';if(sel&&sel.kind==='comp'&&sel.obj.type!=='ground'&&sel.obj.Vp){const o=sel.obj;const dv=o.type==='battery'?o.Vp[1]-o.Vp[0]:o.Vp[0]-o.Vp[1];
    s=NAMES[o.type]+' '+fmtSI(dv,'V')+' · '+fmtSI(o.I||0,'A');}
  else if(sel&&sel.kind==='wire')s='WIRE '+fmtSI(Math.abs(sel.obj.I||0),'A');
  else if(sel&&sel.kind==='body')s=sel.obj.mat.name+' '+bodyMass(sel.obj).toFixed(1)+'g';
  else if(sel&&sel.kind==='rope')s=(sel.obj.style==='chain'?'CHAIN ':'ROPE ')+sel.obj.n+' links · '+M.ropeLength(sel.obj).toFixed(0)+' mm'+(sel.obj.closed?' · loop':'');
  $('hSel').textContent=s;
}

// ---------- floating selection handles (MATTER_LAB_3D pattern) ----------
const HB={L:$('hL'),R:$('hR'),U:$('hU'),P:$('hP')},hLbl=$('hLbl'),HF={L:null,R:null,U:null,P:null};
for(const k in HB)HB[k].addEventListener('click',e=>{e.stopPropagation();const f=HF[k];if(f)f();});
const clampv=(v,a,b)=>v<a?a:v>b?b:v;
function putH(k,x,y,txt,fn,cls){const el=HB[k];HF[k]=fn;
  if(el.textContent!==txt)el.textContent=txt;el.className='hh'+(cls?' '+cls:'');
  const l=Math.round(clampv(x,22,W-22))+'px',t=Math.round(y)+'px';if(el.style.left!==l)el.style.left=l;if(el.style.top!==t)el.style.top=t;
  if(el.style.display!=='block')el.style.display='block';}
function hideH(k){HF[k]=null;if(HB[k].style.display!=='none')HB[k].style.display='none';}
let hLblT=0,hLblSel=null;
function updateHandles(dt){
  if(sel!==hLblSel){hLblSel=sel;hLblT=0;}
  if(sel&&((sel.kind==='comp'&&!S.comps.includes(sel.obj))||(sel.kind==='wire'&&!S.wires.includes(sel.obj))||(sel.kind==='body'&&!E.bodies.includes(sel.obj))||(sel.kind==='rope'&&!E.ropes.includes(sel.obj)))){sel=null;buildSel();}
  if(!set.handles||!sel||act){hideH('L');hideH('R');hideH('U');hideH('P');hLbl.style.display='none';return;}
  const ymax=deck.getBoundingClientRect().top-22,cy=y=>clampv(y,40,ymax);
  let lx,ly,lab;
  if(sel.kind==='comp'){
    const c=sel.obj,s=toScreen(c.x,c.y),off=34*view.s+24,up=(c.type==='ground'?26:c.type==='magnet'?34:c.type==='motor'?22:c.type==='gate'||c.type==='relay'||c.type==='button'?26:18)*view.s+24;
    putH('L',s.x-off,cy(s.y),'−',()=>deleteComp(c),'del');
    putH('R',s.x+off,cy(s.y),'↻',()=>rotateComp(c));
    if(c.type==='switch')putH('U',s.x,cy(s.y-up),c.p.closed?'OFF':'ON',()=>toggleSwitch(c),'txt');
    else if(c.burnt)putH('U',s.x,cy(s.y-up),'FIX',()=>repairLed(c),'txt');
    else if(c.type==='gate'){const ks=['AND','OR','XOR','NAND','NOR','XNOR'],nk=ks[(ks.indexOf(c.p.kind)+1)%ks.length];
      putH('U',s.x,cy(s.y-up),nk,()=>{pushUndo();c.p.kind=nk;buildSel();changed();},'txt');}
    else if(c.type==='relay'||c.type==='button')putH('U',s.x,cy(s.y-up),c.p.nc?'NC':'NO',()=>{pushUndo();c.p.nc=!c.p.nc;buildSel();changed();},'txt');
    else if(c.type==='magnet')putH('U',s.x,cy(s.y-up),c.p.buzz?'BZ✓':'BZ',()=>{pushUndo();c.p.buzz=!c.p.buzz;buildSel();changed();},'txt');
    else putH('U',s.x,cy(s.y-up),'×2',()=>dupComp(c),'txt');
    if(c.type!=='ground'){const on=S.probes.some(q=>q.c===c.id);putH('P',s.x+off,cy(s.y-up),'SCP',()=>{toggleProbe(c);buildSel();},'txt'+(on?' lit':''));}else hideH('P');
    lx=s.x;ly=cy(s.y+(c.type==='motor'?20:16)*view.s+22);
    lab=c.type==='ground'?'GROUND · 0 V':c.type==='motor'?'MOTOR · '+Math.round((c.omega||0)*60/(2*Math.PI)).toLocaleString()+' rpm · '+fmtSI(c.I||0,'A')
      :c.type==='magnet'?'MAGNET · '+fmtSI(c.F||0,'N')+' · '+fmtSI(c.I||0,'A'):NAMES[c.type]+' · '+fmtSI(c.I||0,'A');
  }else if(sel.kind==='body'){
    const b=sel.obj;M.updateAABB(b);const f=M.bodyFrame(b),s=toScreen(f.x,f.y),rx=(b.maxx-b.minx)/2*view.s+22,ry=(b.maxy-b.miny)/2*view.s+20;
    putH('L',s.x-rx,cy(s.y),'−',()=>deleteBody(b),'del');
    putH('R',s.x+rx,cy(s.y),'↻',()=>rotateBody(b,15));
    const names=Object.keys(M.MATERIALS),nx=names[(names.indexOf(b.mat.name)+1)%names.length];
    putH('U',s.x,cy(s.y-ry),nx.slice(0,3),()=>setBodyMat(b,nx),'txt');
    putH('P',s.x+rx,cy(s.y-ry),'AXL',()=>toggleAxle(b),'txt'+(b.axle?' lit':''));
    lx=s.x;ly=cy(s.y+ry);lab=b.mat.name+' · '+bodyMass(b).toFixed(1)+' g'+(b.axle?(b.axle.motor?' · driven':' · axle'):'');
  }else if(sel.kind==='rope'){
    const R=sel.obj;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(let i=0;i<R.n;i++){x0=Math.min(x0,R.x[i]);x1=Math.max(x1,R.x[i]);y0=Math.min(y0,R.y[i]);y1=Math.max(y1,R.y[i]);}
    const a=toScreen((x0+x1)/2,y0),bt=toScreen((x0+x1)/2,y1),y=cy(a.y-30);hideH('P');
    putH('L',a.x-34,y,'−',()=>deleteRope(R),'del');
    putH('R',a.x+34,y,R.style==='chain'?'RPE':'CHN',()=>{pushUndo();R.style=R.style==='chain'?'rope':'chain';buildSel();changed();},'txt');
    putH('U',a.x,y,R.closed?'OPEN':'LOOP',()=>{pushUndo();R.closed=!R.closed&&R.n>=4;buildSel();changed();},'txt'+(R.closed?' lit':''));
    lx=bt.x;ly=cy(bt.y+22);lab=(R.style==='chain'?'CHAIN':'ROPE')+' · '+R.n+' links · '+M.ropeLength(R).toFixed(0)+' mm';
  }else{
    hideH('P');const w=sel.obj,m=wireMid(w),s=toScreen(m.x,m.y),y=cy(s.y-34);
    putH('L',s.x-22,y,'−',()=>deleteWire(w),'del');
    const nx=STYLES[(STYLES.indexOf(w.style||'drawn')+1)%3];
    putH('R',s.x+22,y,nx==='drawn'?'DRW':nx==='straight'?'STR':'ELB',()=>cycleWireStyle(w),'txt');
    if(w.style==='elbow')putH('U',s.x+66,y,'FLIP',()=>{pushUndo();w.flip=!w.flip;changed();},'txt');else hideH('U');
    lx=s.x;ly=cy(s.y+22);lab='WIRE · '+fmtSI(Math.abs(w.I||0),'A')+' · '+(w.style||'drawn');
  }
  hLblT-=dt||0;if(hLblT<=0){hLblT=0.1;if(hLbl.textContent!==lab)hLbl.textContent=lab;}
  hLbl.style.display='block';hLbl.style.left=Math.round(clampv(lx,60,W-60))+'px';hLbl.style.top=Math.round(ly)+'px';
}

// ---------- scope ----------
const SCOPE_COL=['#00e5ff','#ffb000','#e0805f','#b9a6e8'];
const QUANT={gate:['OUT','I'],not:['OUT','I'],relay:['COIL','I'],button:['I','V'],battery:['V','I'],resistor:['V','I','P'],led:['I','V'],diode:['I','V'],capacitor:['V','I'],switch:['I','V'],motor:['RPM','I','V'],magnet:['F','I','GAP']};
const QUNIT={V:'V',I:'A',P:'W',F:'N',OUT:'V',COIL:'A'};
let scopeBuf=[];
function scopeReset(){scopeBuf=[];buildScopeHead();}
function toggleProbe(c){
  const i=S.probes.findIndex(p=>p.c===c.id);
  if(i>=0)S.probes.splice(i,1);
  else{if(S.probes.length>=4){flash('SCOPE FULL — 4 CHANNELS');return;}S.probes.push({c:c.id,q:QUANT[c.type][0]});set.scopeOpen=true;}
  scopeReset();changed();
}
function probeVal(p){
  const c=compById(p.c);if(!c||!c.Vp)return 0;
  switch(p.q){
    case 'V':return c.type==='battery'?c.Vp[1]-c.Vp[0]:c.Vp[0]-c.Vp[1];
    case 'I':return c.I||0;case 'P':return c.P||0;
    case 'OUT':return c.Vp[GATE_OUT[c.type]]||0;case 'COIL':return c.Ic||0;
    case 'RPM':return (c.omega||0)*60/(2*Math.PI);case 'F':return c.F||0;case 'GAP':return (c.g||0)*1000;
  }return 0;
}
function fmtQ(q,v){return q==='RPM'?Math.round(v).toLocaleString()+' rpm':q==='GAP'?v.toFixed(2)+' mm':fmtSI(v,QUNIT[q]);}
const scopeEl=$('scope'),scopeCv=$('scopeCv'),scopeHead=$('scopeHead'),sctx=scopeCv.getContext('2d');
function buildScopeHead(){
  scopeHead.innerHTML='';
  const tg=document.createElement('button');tg.className='sch';tg.textContent=set.scopeOpen?'▴ SCOPE':'▾ SCOPE';
  tg.addEventListener('click',()=>{set.scopeOpen=!set.scopeOpen;saveSettings();buildScopeHead();});scopeHead.append(tg);
  S.probes.forEach((p,i)=>{
    const c=compById(p.c);if(!c)return;const b=document.createElement('span');b.className='sch';b.style.borderColor=SCOPE_COL[i];
    const t=document.createElement('span');t.style.color=SCOPE_COL[i];t.dataset.ch=i;t.textContent=NAMES[c.type]+'#'+c.id+' '+p.q;
    t.addEventListener('click',()=>{const qs=QUANT[c.type];p.q=qs[(qs.indexOf(p.q)+1)%qs.length];scopeReset();changed();});
    const v=document.createElement('span');v.className='schv';v.id='schv'+i;
    const x=document.createElement('span');x.className='schx';x.textContent='×';x.addEventListener('click',()=>{S.probes.splice(i,1);scopeReset();buildSel();changed();});
    b.append(t,v,x);scopeHead.append(b);
  });
  scopeEl.style.display=S.probes.length?'block':'none';scopeCv.style.display=set.scopeOpen?'block':'none';
  scopeEl.style.top=$('hud').offsetHeight+'px';
}
function scopeSample(){
  if(!S.probes.length)return;
  if(set.playing){scopeBuf.push({t:simT,v:S.probes.map(probeVal)});
    const t0=simT-set.scopeWin;let k=0;while(k<scopeBuf.length-2&&scopeBuf[k+1].t<t0)k++;if(k)scopeBuf.splice(0,k);
    if(scopeBuf.length>4000)scopeBuf.splice(0,scopeBuf.length-4000);}
}
function drawScope(){
  if(!S.probes.length||!set.scopeOpen)return;
  const cw=scopeCv.clientWidth,ch=scopeCv.clientHeight;if(!cw)return;
  if(scopeCv.width!==Math.round(cw*DPR)||scopeCv.height!==Math.round(ch*DPR)){scopeCv.width=Math.round(cw*DPR);scopeCv.height=Math.round(ch*DPR);}
  sctx.setTransform(DPR,0,0,DPR,0,0);sctx.clearRect(0,0,cw,ch);
  sctx.strokeStyle='rgba(247,227,195,0.07)';sctx.lineWidth=1;
  for(let k=1;k<4;k++){const y=Math.round(ch*k/4)+0.5;sctx.beginPath();sctx.moveTo(0,y);sctx.lineTo(cw,y);sctx.stroke();}
  for(let k=1;k<8;k++){const x=Math.round(cw*k/8)+0.5;sctx.beginPath();sctx.moveTo(x,0);sctx.lineTo(x,ch);sctx.stroke();}
  if(scopeBuf.length<2)return;
  const t1=scopeBuf[scopeBuf.length-1].t,t0=t1-set.scopeWin,pad=4;
  sctx.font='8px "IBM Plex Mono","SF Mono",ui-monospace,monospace';sctx.textBaseline='top';
  S.probes.forEach((p,i)=>{
    let lo=Infinity,hi=-Infinity;for(const s of scopeBuf){const v=s.v[i];if(v<lo)lo=v;if(v>hi)hi=v;}
    if(!isFinite(lo))return;if(lo>0)lo=0;if(hi<0)hi=0;if(hi-lo<1e-9){hi+=1e-9;}
    const sp=(hi-lo)*0.08;lo-=sp;hi+=sp;
    sctx.strokeStyle=SCOPE_COL[i];sctx.lineWidth=1.3;sctx.beginPath();
    let first=true;for(const s of scopeBuf){const x=(s.t-t0)/set.scopeWin*cw,y=pad+(1-(s.v[i]-lo)/(hi-lo))*(ch-2*pad);
      if(first){sctx.moveTo(x,y);first=false;}else sctx.lineTo(x,y);}
    sctx.stroke();
    sctx.fillStyle=SCOPE_COL[i];sctx.fillText(fmtQ(p.q,hi),4+i*72,2);
  });
}
let scopeTxtT=0;
function scopeText(dt){scopeTxtT-=dt;if(scopeTxtT>0)return;scopeTxtT=0.15;
  S.probes.forEach((p,i)=>{const e=$('schv'+i);if(e){const t=' '+fmtQ(p.q,probeVal(p));if(e.textContent!==t)e.textContent=t;}});}

// ---------- boot ----------
buildSel();buildSim();buildBodies();
let restored=false;
try{const s=localStorage.getItem('circuitlab4_auto');if(s){deserialize(s);restored=S.comps.length>0;}}catch(e){restored=false;}
if(!restored)loadDemo();else fitView();
buildScopeHead();window.addEventListener('resize',()=>{scopeEl.style.top=$('hud').offsetHeight+'px';});
setTool('select');flash(restored?'RESTORED LAST SESSION':'DEMO — tap the switch twice to toggle it',3);
window.CIRCUIT_LAB={loadContraption,loadChainDemo,fitView,M,E,loadRotorDemo,bodyById,get scopeBuf(){return scopeBuf;},toggleProbe,S,view,set,placeComp,finishWire,deleteComp,toggleSwitch,loadDemo,serialize,deserialize,wirePts,endPos,HF,get sel(){return sel;},get status(){return status;}};
requestAnimationFrame(frame);
})();
</script>
